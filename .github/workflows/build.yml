name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_suffix: ""
            asset_name: flyx-linux-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            binary_suffix: ""
            asset_name: flyx-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_suffix: ".exe"
            asset_name: flyx-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies and build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "rust-${{ matrix.target }}"
          key: "build-${{ matrix.target }}"

      - name: Build flyx client
        run: cargo build --release --bin client --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/client${{ matrix.binary_suffix }} dist/${{ matrix.asset_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./dist

      - name: Prepare release assets
        run: |
          cd dist
          # Move binaries to root and create archives
          for dir in */; do
            binary_name=$(basename "$dir")
            mv "$dir/$binary_name" ./
            if [[ "$binary_name" == *.exe ]]; then
              zip "${binary_name%.exe}.zip" "$binary_name"
            else
              tar -czf "${binary_name}.tar.gz" "$binary_name"
            fi
          done

          # Generate checksums
          sha256sum *.tar.gz *.zip > checksums.sha256

          ls -la *.{tar.gz,zip,sha256}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
