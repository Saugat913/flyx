name: Build and Release Client

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Client for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "rust-client-${{ matrix.target }}"
          key: "client-build-${{ matrix.target }}"
          workspaces: "client"

      - name: Build client
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path client/Cargo.toml

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p artifacts
          
          # Set binary name and extension
          if [[ "${{ matrix.platform }}" == *windows* ]]; then
            BINARY_NAME="flyx-${{ matrix.platform }}.exe"
            SOURCE_BINARY="target/${{ matrix.target }}/release/flyx.exe"
          else
            BINARY_NAME="flyx-${{ matrix.platform }}"
            SOURCE_BINARY="target/${{ matrix.target }}/release/flyx"
          fi
          
          # Debug: Show what was actually built
          echo "Looking for binary at: $SOURCE_BINARY"
          ls -la target/${{ matrix.target }}/release/ || echo "Release directory not found"
          
          # Copy and rename binary
          cp "$SOURCE_BINARY" "artifacts/$BINARY_NAME"
          
          # Make executable (for Unix-like systems)
          if [[ "${{ matrix.platform }}" != *windows* ]]; then
            chmod +x "artifacts/$BINARY_NAME"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flyx-${{ matrix.platform }}
          path: artifacts/flyx-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          
          # Debug: Show artifact structure
          echo "Downloaded artifacts structure:"
          find artifacts -type f -ls
          
          # Process each artifact directory
          for artifact_dir in artifacts/*/; do
            if [[ -d "$artifact_dir" ]]; then
              artifact_name=$(basename "$artifact_dir")
              echo "Processing artifact: $artifact_name"
              
              # Find the binary file in the artifact directory
              binary_file=$(find "$artifact_dir" -type f -name "flyx-*" | head -n1)
              
              if [[ -n "$binary_file" ]]; then
                binary_name=$(basename "$binary_file")
                echo "Found binary: $binary_name"
                
                # Copy binary to release assets
                cp "$binary_file" "release-assets/$binary_name"
                
                # Create archive
                cd release-assets
                if [[ "$binary_name" == *.exe ]]; then
                  zip "${binary_name%.exe}.zip" "$binary_name"
                  rm "$binary_name"  # Remove original binary, keep only archive
                else
                  tar -czf "${binary_name}.tar.gz" "$binary_name"
                  rm "$binary_name"  # Remove original binary, keep only archive
                fi
                cd ..
              else
                echo "Warning: No binary found in $artifact_dir"
              fi
            fi
          done
          
          # Generate checksums
          cd release-assets
          if ls *.tar.gz *.zip 1> /dev/null 2>&1; then
            sha256sum *.tar.gz *.zip > checksums.sha256
            echo "Generated checksums:"
            cat checksums.sha256
          else
            echo "No archives found to generate checksums for"
            exit 1
          fi
          
          echo "Final release assets:"
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
          name: "Flyx Client ${{ github.ref_name }}"
          body: |
            ## Flyx Client Release ${{ github.ref_name }}
            
            Cross-platform binaries for the Flyx client.
            
            ### Downloads:
            - **Linux (x86_64)**: `flyx-linux-amd64.tar.gz`
            - **macOS (ARM64)**: `flyx-macos-arm64.tar.gz`
            - **Windows (x86_64)**: `flyx-windows-amd64.zip`
            
            ### Installation:
            1. Download the appropriate archive for your platform
            2. Extract the binary
            3. Move to a directory in your PATH (optional)
            4. Run `flyx --help` to get started
            
            ### Verification:
            Use the provided `checksums.sha256` file to verify download integrity:
            ```bash
            sha256sum -c checksums.sha256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
