name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_suffix: ""
            asset_name: flyx-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_suffix: ""
            asset_name: flyx-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_suffix: ""
            asset_name: flyx-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_suffix: ".exe"
            asset_name: flyx-windows-amd64.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Build flyx client
      run: cargo build --release --bin client --target ${{ matrix.target }}

    - name: Prepare binary
      shell: bash
      run: |
        mkdir -p dist
        cp target/${{ matrix.target }}/release/client${{ matrix.binary_suffix }} dist/${{ matrix.asset_name }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: ./dist

    - name: Prepare release assets
      run: |
        cd dist
        # Make binaries executable
        chmod +x flyx-*/{flyx-linux-amd64,flyx-macos-amd64,flyx-macos-arm64}
        
        # Move binaries to root and create archives
        for dir in */; do
          binary_name=$(basename "$dir")
          mv "$dir/$binary_name" ./
          if [[ "$binary_name" == *.exe ]]; then
            zip "${binary_name%.exe}.zip" "$binary_name"
          else
            tar -czf "${binary_name}.tar.gz" "$binary_name"
          fi
        done
        
        ls -la *.{tar.gz,zip}

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.tar.gz
          dist/*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
